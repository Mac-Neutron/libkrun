[workspace]
members = [
    "src/libkrun",
    "init/init-blob",
    "bindings/init-blob-via-cdylib",
    "src/input",
    "src/display",
    "src/utils",
    "src/arch_gen",
    "src/cpuid",
    "src/smbios",
    "src/polly",
    "src/kernel",
    "src/arch",
    "src/hvf",
    "src/devices",
    "src/rutabaga_dxmt",
    "src/aws_nitro",
    "src/whp",
    "bindings/libkrun-via-cdylib-weak",
]
exclude = [
    "examples/gtk_display",
    "init/init-binary",
    "init/aws-nitro",
]
resolver = "2"

# MacNeutron: libkrun's gpu device on the dxmt stand-in instead of rutabaga_gfx and virglrenderer.
[patch.crates-io]
rutabaga_gfx = { path = "src/rutabaga_dxmt" }
#panic = "abort"

[profile.release]
#panic = "abort"
lto = true
